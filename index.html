        whatsapp_btn: "تواصل عبر واتساب",
        hero_subtitle: "اكتشف اختياراتنا المميزة من السيارات والعقارات، وجهّز منزلك بأرقى الأثاث والأجهزة المنزلية.",
        sections_label: "الأقسام",
        sections_heading: "ثلاث عوالم من الفخامة",
        view_more: "عرض المزيد",
        items_count: "قطعة",
        curated_label: "مختاراتنا لك",
        curated_heading: "مختارات مميزة من جميع الأقسام",
        footer_rights: "جميع الحقوق محفوظة",
        tap_to_zoom: "اضغط على الصورة للتكبير",
        inquire_whatsapp: "استفسر الآن عبر واتساب",
        search_placeholder: "ابحث باسم المنتج أو المواصفات...",
        all_filter: "الكل",
        no_results: "لا توجد منتجات مطابقة لبحثك حالياً."
      },

        whatsapp_btn: "Contact via WhatsApp",

        sections_heading: "Three Worlds of Luxury",
        view_more: "View More",

        curated_heading: "Featured Selections",
        footer_rights: "All Rights Reserved",

        inquire_whatsapp: "Inquire on WhatsApp",
        search_placeholder: "Search products or specs...",
        all_filter: "All",
        no_results: "No matching items found."
      }
    };


    function t(key) {
      return (I18N[state.lang] && I18N[state.lang][key]) || key;
    }


    function getSiteName() {
      return (state.siteSettings && state.siteSettings.siteName) || "Magnet Group";
    }


    function getSiteLogo() {
      return (state.siteSettings && state.siteSettings.siteLogo) || "";
    }


    function getCategoryConfig(catId) {
      const base = CATEGORIES.find(c => c.id === catId) || CATEGORIES[0];
      const custom = (state.siteSettings && state.siteSettings.categories && state.siteSettings.categories[base.id]) || {};
      return {
        ...base,
        name: (custom.name && custom.name.trim()) ? custom.name.trim() : base.name,
        coverImage: custom.coverImage || "",
        logoImage: custom.logoImage || ""
      };
    }


    function getAllCategories() {
      return CATEGORIES.map(c => getCategoryConfig(c.id));
    }


    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.add("hidden"), 3200);
    }


    function formatPrice(price, currency = "EGP") {
      const num = Number(price || 0);
      const formatted = num.toLocaleString("en-US");
      return currency === "USD" ? `$ ${formatted}` : `EGP  ${formatted}`;
    }


    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }


    function formatDescriptionHtml(text) {
      if (!text) return "";
      const lines = escapeHtml(text).split(/\r?\n/);
      return lines.map(line => {
        const trimmed = line.trim();
        if (!trimmed) return '<div class="h-1.5"></div>';
        const bolded = trimmed.replace(/\*\*(.+?)\*\*/g, '<strong class="text-[#0B132B] font-bold">$1</strong>');
        if (trimmed.startsWith("•") || trimmed.startsWith("-")) {
          return `<div class="flex items-start gap-2"><span class="text-[#C8A236] font-bold mt-0.5">•</span><span>${bolded.replace(/^[•\-]\s*/, "")}</span></div>`;
        }
        return `<p>${bolded}</p>`;
      }).join("");
    }


    function stripMarkdown(text) {
      return String(text || "").replace(/\*\*/g, "").replace(/\n+/g, " • ");
    }


    function pickRandomSelection() {
      const shuffled = [...state.products].sort(() => Math.random() - 0.5);
      state.randomIds = shuffled.slice(0, 10).map(p => p.id);
    }


    function renderDefaultSiteEmblem(size = "sm") {
      const siteName = getSiteName();
      const firstChar = escapeHtml((siteName || "M").trim().charAt(0).toUpperCase() || "M");
      if (size === "lg") {
        return `
          <span class="font-luxury text-4xl font-bold text-[#E3C265] leading-none">${firstChar}</span>
          <span class="text-[8px] tracking-[0.18em] text-[#E3C265] font-bold mt-1.5 px-1 truncate max-w-full">${escapeHtml(siteName.slice(0, 10).toUpperCase())}</span>
        `;
      }
      return `
        <span class="font-luxury text-[#E3C265] text-lg font-bold leading-none">${firstChar}</span>
        <span class="text-[6px] tracking-widest text-[#E3C265] font-semibold mt-0.5 px-0.5 truncate max-w-full">${escapeHtml(siteName.slice(0, 7).toUpperCase())}</span>
      `;
    }


    function renderCategoryLogoInner(cat, textSizeClass = "text-xl") {
      if (cat.logoImage) {
        return `<img src="${escapeHtml(cat.logoImage)}" alt="${escapeHtml(cat.name)}" class="w-full h-full object-contain" />`;
      }
      const firstChar = escapeHtml((cat.name || "M").trim().charAt(0).toUpperCase() || "M");
      return `<span class="font-luxury text-[#E3C265] ${textSizeClass} font-bold">${firstChar}</span>`;
    }


    function syncBrandChrome() {
      const siteName = getSiteName();
      const siteLogo = getSiteLogo();


      document.title = `${siteName} | سيارات فاخرة • عقارات • أثاث وأجهزة منزلية`;


      const headerNameEl = document.getElementById("header-site-name");
      if (headerNameEl) headerNameEl.textContent = siteName;


      const footerNameEl = document.getElementById("footer-site-name");
      if (footerNameEl) footerNameEl.textContent = siteName;


      const headerLogoEl = document.getElementById("header-site-logo");
      if (headerLogoEl) {
        if (siteLogo) {
          headerLogoEl.innerHTML = `<img src="${escapeHtml(siteLogo)}" alt="${escapeHtml(siteName)}" class="w-full h-full object-contain" />`;
        } else {
          headerLogoEl.innerHTML = renderDefaultSiteEmblem("sm");
        }
      }


      const faviconEl = document.getElementById("dynamic-favicon");
      if (faviconEl && siteLogo) {
        faviconEl.href = siteLogo;
      }
    }


    // =========================================================================
    // 4. محرك Firebase + التخزين المحلي (للمنتجات وإعدادات الموقع والأقسام)
    // =========================================================================
    function loadLocalSiteSettings() {
      try {
        const saved = localStorage.getItem(SETTINGS_STORAGE_KEY);
        if (saved) {
          state.siteSettings = normalizeSiteSettings(JSON.parse(saved));
          return;
        }
      } catch (e) {}
      state.siteSettings = createDefaultSiteSettings();
    }


    function saveLocalSiteSettings(settingsObj) {
      try {
        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settingsObj));
      } catch (e) {
        // Ignore quota warnings when Firebase is primary
      }
    }


    async function loadFirestoreSiteSettings() {
      if (!isFirebaseConfigured || !state.fb) return;
      try {
        const { db, fsMod } = state.fb;
        const [metaSnap, imgsSnap] = await Promise.all([
          fsMod.getDoc(fsMod.doc(db, "products", SITE_SETTINGS_DOC_ID)),
          fsMod.getDocs(fsMod.collection(db, "products", SITE_SETTINGS_DOC_ID, "images"))
        ]);


        if (!metaSnap.exists() && imgsSnap.empty) return;


        const base = metaSnap.exists() ? metaSnap.data() : {};
        const merged = normalizeSiteSettings(base);


        imgsSnap.forEach(d => {
          const key = d.id;
          const val = (d.data() && d.data().data) || "";
          if (!val) return;
          if (key === "siteLogo") {
            merged.siteLogo = val;
          } else {
            const match = key.match(/^cat_([a-z]+)_(cover|logo)$/);
            if (match && merged.categories[match[1]]) {
              if (match[2] === "cover") merged.categories[match[1]].coverImage = val;
              if (match[2] === "logo") merged.categories[match[1]].logoImage = val;
            }
          }
        });


        state.siteSettings = merged;
        saveLocalSiteSettings(merged);
      } catch (err) {
        console.warn("Could not load site settings from Firestore:", err);
      }
    }


    async function saveSiteSettingsToBackend(rawSettings) {
      const normalized = normalizeSiteSettings(rawSettings);


      if (!isFirebaseConfigured || !state.fb) {
        state.siteSettings = normalized;
        saveLocalSiteSettings(normalized);
        return;
      }


      const { db, fsMod } = state.fb;
      const metaPayload = {
        isSiteSettings: true,
        siteName: normalized.siteName,
        categories: {},
        updatedAt: Date.now()
      };
      CATEGORIES.forEach(c => {
        metaPayload.categories[c.id] = { name: normalized.categories[c.id].name };
      });


      await fsMod.setDoc(fsMod.doc(db, "products", SITE_SETTINGS_DOC_ID), metaPayload);


      const imageEntries = [
        ["siteLogo", normalized.siteLogo],
        ...CATEGORIES.flatMap(c => [
          [`cat_${c.id}_cover`, normalized.categories[c.id].coverImage],
          [`cat_${c.id}_logo`, normalized.categories[c.id].logoImage]
        ])
      ];


      for (const [key, data] of imageEntries) {
        const ref = fsMod.doc(db, "products", SITE_SETTINGS_DOC_ID, "images", key);
        if (data && data.trim()) {
          await fsMod.setDoc(ref, { key, data: data.trim(), updatedAt: Date.now() });
        } else {
          await fsMod.deleteDoc(ref).catch(() => {});
        }
      }


      state.siteSettings = normalized;
      saveLocalSiteSettings(normalized);
    }


    async function initFirebaseAndData() {
      // Apply cached branding immediately for smooth paint
      loadLocalSiteSettings();
      syncBrandChrome();


      if (!isFirebaseConfigured) {
        loadLocalProducts();
        pickRandomSelection();
        handleHashRoute();
        return;
      }


      try {
        const [appMod, authMod, fsMod] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js")
        ]);


        const app = appMod.initializeApp(USER_FIREBASE_CONFIG);
        const auth = authMod.getAuth(app);
        const db = fsMod.getFirestore(app);
        state.fb = { app, auth, db, authMod, fsMod };


        authMod.onAuthStateChanged(auth, (user) => {
          state.user = user;
          state.authReady = true;
          if (state.view === "admin") render();
        });


        await Promise.all([
          loadFirestoreProducts(),
          loadFirestoreSiteSettings()
        ]);
      } catch (err) {
        console.error("Firebase init failed, using local fallback:", err);
        loadLocalProducts();
      }


      syncBrandChrome();
      pickRandomSelection();
      handleHashRoute();
    }


    function loadLocalProducts() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.products = parsed;
            return;
          }
        }
      } catch (e) {}
      state.products = structuredClone(INITIAL_PRODUCTS);
    }


    function saveLocalProducts() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.products));
      } catch (e) {
        showToast("مساحة التخزين المحلي ممتلئة — اربط Firebase لحفظ صور أكثر.");
      }
    }


    async function loadFirestoreProducts() {
      const { db, fsMod } = state.fb;
      const snap = await fsMod.getDocs(fsMod.collection(db, "products"));
      const list = [];
      snap.forEach(d => {
        const data = d.data();
        if (d.id === SITE_SETTINGS_DOC_ID || data.isSiteSettings) return;
        list.push({
          id: d.id,
          ...data,
          images: data.coverImage ? [data.coverImage] : (data.images || [])
        });
      });


      if (list.length === 0) {
        state.products = structuredClone(INITIAL_PRODUCTS);
        state.firestoreEmpty = true;
      } else {
        state.firestoreEmpty = false;
        list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        state.products = list;
      }
    }


    async function fetchProductFullImages(product) {
      if (!isFirebaseConfigured || !state.fb || state.firestoreEmpty) {
        return product.images && product.images.length
          ? product.images
          : [makeLuxuryPlaceholder(getCategoryConfig(product.category).name, product.title)];
      }
      try {
        const { db, fsMod } = state.fb;
        const colRef = fsMod.collection(db, "products", product.id, "images");
        const snap = await fsMod.getDocs(colRef);
        if (!snap.empty) {
          const imgs = [];
          snap.forEach(d => imgs.push({ idx: d.data().index ?? 0, data: d.data().data }));
          imgs.sort((a, b) => a.idx - b.idx);
          return imgs.map(i => i.data);
        }
      } catch (e) {
        console.warn("Could not load subcollection images:", e);
      }
      return product.images && product.images.length
        ? product.images
        : [makeLuxuryPlaceholder(getCategoryConfig(product.category).name, product.title)];
    }


    async function saveProductToBackend(productObj, imagesArray) {
      const catName = getCategoryConfig(productObj.category).name;
      const finalImages = imagesArray.length > 0
        ? imagesArray.slice(0, MAX_IMAGES_PER_PRODUCT)
        : [makeLuxuryPlaceholder(catName, productObj.title)];


      if (!isFirebaseConfigured || !state.fb) {
        const fullObj = { ...productObj, images: finalImages, createdAt: productObj.createdAt || Date.now() };
        const idx = state.products.findIndex(p => p.id === fullObj.id);
        if (idx >= 0) state.products[idx] = fullObj;
        else state.products.unshift(fullObj);
        saveLocalProducts();
        return;
      }


      const { db, fsMod } = state.fb;
      const docRef = fsMod.doc(db, "products", productObj.id);
      const payload = {
        category: productObj.category,
        subcategory: productObj.subcategory || "",
        title: productObj.title,
        price: Number(productObj.price || 0),
        currency: productObj.currency || "EGP",
        description: productObj.description || "",
        coverImage: finalImages[0],
        imageCount: finalImages.length,
        createdAt: productObj.createdAt || Date.now(),
        updatedAt: Date.now()
      };
      await fsMod.setDoc(docRef, payload);


      // Clear old subcollection images and write up to 15 high-res images safely
      const imgCol = fsMod.collection(db, "products", productObj.id, "images");
      const oldSnap = await fsMod.getDocs(imgCol);
      for (const oldDoc of oldSnap.docs) {
        await fsMod.deleteDoc(oldDoc.ref);
      }
      for (let i = 0; i < finalImages.length; i++) {
        await fsMod.setDoc(fsMod.doc(db, "products", productObj.id, "images", `img_${String(i).padStart(2, "0")}`), {
          index: i,
          data: finalImages[i]
        });
      }


      await loadFirestoreProducts();
    }


    async function deleteProductFromBackend(productId) {
      if (!isFirebaseConfigured || !state.fb) {
        state.products = state.products.filter(p => p.id !== productId);
        saveLocalProducts();
        return;
      }
      const { db, fsMod } = state.fb;
      const imgCol = fsMod.collection(db, "products", productId, "images");
      const oldSnap = await fsMod.getDocs(imgCol);
      for (const oldDoc of oldSnap.docs) {
        await fsMod.deleteDoc(oldDoc.ref);
      }
      await fsMod.deleteDoc(fsMod.doc(db, "products", productId));
      await loadFirestoreProducts();
    }


    window.seedInitialToFirebase = async function () {
      if (!isFirebaseConfigured || !state.fb) return;
      showToast("جاري رفع المنتجات الأساسية الـ 20 إلى Firebase...");
      try {
        for (const p of INITIAL_PRODUCTS) {
          await saveProductToBackend(p, p.images);
        }
        state.firestoreEmpty = false;
        showToast("تم رفع جميع المنتجات الأساسية بنجاح!");
        render();
      } catch (err) {
        console.error(err);
        showToast("حدث خطأ أثناء الرفع. تأكد من صلاحيات Rules في Firestore.");
      }
    };


    // =========================================================================
    // 5. التنقل والواجهات (Home / Category / Admin)
    // =========================================================================
    function handleHashRoute() {
      const hash = window.location.hash || "";
      if (hash === "#/admin") {
        state.view = "admin";
      } else if (hash.startsWith("#/category/")) {
        const catId = hash.replace("#/category/", "");
        if (CATEGORIES.some(c => c.id === catId)) {
          state.view = "category";
          state.activeCategoryId = catId;
        } else {
          state.view = "home";
        }
      } else {
        state.view = "home";
      }
      render();
    }


    window.addEventListener("hashchange", handleHashRoute);


    window.goHome = function () {
      window.location.hash = "";
      state.view = "home";
      state.activeCategoryId = null;
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    };


    window.openCategory = function (catId) {
      state.activeCategoryId = catId;
      state.categorySearch = "";
      state.categorySubFilter = "all";
      window.location.hash = `#/category/${catId}`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };


    window.openAdminRoute = function () {
      window.location.hash = "#/admin";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };


    window.toggleLanguage = function () {
      state.lang = state.lang === "ar" ? "en" : "ar";
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";


      const arBadge = document.getElementById("lang-ar-badge");
      const enBadge = document.getElementById("lang-en-badge");
      if (state.lang === "ar") {
        arBadge.className = "px-2.5 py-1 rounded-full gold-gradient text-[#0B132B] transition";
        enBadge.className = "px-2.5 py-1 rounded-full text-gray-500 transition";
      } else {
        enBadge.className = "px-2.5 py-1 rounded-full gold-gradient text-[#0B132B] transition";
        arBadge.className = "px-2.5 py-1 rounded-full text-gray-500 transition";
      }
      render();
    };

        <article onclick="openProductModal('${p.id}')" class="bg-white rounded-3xl border border-gray-100 card-shadow overflow-hidden cursor-pointer flex items-stretch min-h-[155px] sm:min-h-[170px]">
          <div class="flex-1 p-4 sm:p-5 flex flex-col justify-between min-w-0">

              ${p.subcategory ? `<div class="text-[11px] font-semibold text-gray-400 mb-1">${escapeHtml(p.subcategory)}</div>` : ""}

              <p class="text-xs text-gray-500 leading-relaxed line-clamp-2">${escapeHtml(excerpt)}...</p>

              </div>
              <div class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center text-gray-400 shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 4.5-15 15m0 0h11.25m-11.25 0V8.25"/></svg>
              </div>

                📷 ${p.imageCount || p.images.length}

    function renderHomeView() {
      const siteName = getSiteName();
      const siteLogo = getSiteLogo();
      const allCategories = getAllCategories();


      const catCardsHtml = allCategories.map(cat => {
        const count = state.products.filter(p => p.category === cat.id).length;
        const tags = state.lang === "ar" ? cat.tagsAr : cat.tagsEn;
        const hasCover = Boolean(cat.coverImage);


        return `
          <div onclick="openCategory('${cat.id}')" class="group relative rounded-3xl overflow-hidden cursor-pointer card-shadow bg-gradient-to-br from-[#1C2434] via-[#111827] to-[#0B132B] text-white p-5 sm:p-6 border border-[#C8A236]/25 min-h-[215px] flex flex-col justify-between">
            ${hasCover ? `
              <img src="${escapeHtml(cat.coverImage)}" alt="${escapeHtml(cat.name)}" loading="lazy" class="absolute inset-0 w-full h-full object-cover transition duration-500 group-hover:scale-105" />
              <div class="absolute inset-0 bg-gradient-to-t from-[#0B132B]/95 via-[#0B132B]/70 to-[#0B132B]/40"></div>
            ` : ""}


            <div class="relative z-10 flex items-start justify-between gap-3 mb-4">
              <div class="min-w-0">
                <span class="inline-block text-xs font-bold text-[#E3C265] bg-[#0B132B]/70 backdrop-blur-sm border border-[#E3C265]/30 px-3 py-1 rounded-full mb-2">${count} ${t("items_count")}</span>
                <h3 class="font-luxury text-2xl font-bold tracking-wide drop-shadow-sm">${escapeHtml(cat.name)}</h3>
                <p class="text-xs text-gray-200 mt-1">${state.lang === "ar" ? cat.arSubtitle : cat.enSubtitle}</p>
              </div>
              <div class="w-12 h-12 rounded-2xl bg-[#0B132B]/90 backdrop-blur-sm border border-[#E3C265]/40 flex items-center justify-center shrink-0 overflow-hidden shadow-md">
                ${renderCategoryLogoInner(cat, "text-xl")}
              </div>
            </div>


            <div class="relative z-10">
              <div class="flex flex-wrap gap-2 mb-4">
                ${tags.map(tg => `<span class="text-[11px] bg-white/15 backdrop-blur-sm text-gray-100 px-3 py-1 rounded-full">${tg}</span>`).join("")}
              </div>
              <div class="flex items-center justify-end text-xs font-bold text-[#E3C265] gap-1">
                <span>${t("view_more")}</span>
                <span>${state.lang === "ar" ? "←" : "→"}</span>
              </div>
            </div>
          </div>
        `;
      }).join("");


      // 3 products per category with clickable Header AND "View More" button directly BELOW the 3 products
      const categorySectionsHtml = allCategories.map(cat => {
        const items = state.products.filter(p => p.category === cat.id);
        const topThree = items.slice(0, 3);
        return `
          <section class="mt-12">

    function compressBrandingImage(file, type = "logo") {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxWidth = type === "cover" ? 1100 : 480;
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);


            if (type === "logo") {
              // Preserve transparent background for logos using WebP (or PNG fallback)
              const webpUrl = canvas.toDataURL("image/webp", 0.85);
              if (webpUrl.startsWith("data:image/webp")) {
                resolve(webpUrl);
              } else {
                resolve(canvas.toDataURL("image/png"));
              }
            } else {
              resolve(canvas.toDataURL("image/jpeg", 0.80));
            }
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }


    window.handleBrandingFileUpload = async function (event, targetType, catId = null) {

      try {

        const imgType = targetType === "catCover" ? "cover" : "logo";
        const dataUrl = await compressBrandingImage(file, imgType);


        if (targetType === "siteLogo") {
          draft.siteLogo = dataUrl;
        } else if (targetType === "catCover" && catId && draft.categories[catId]) {
          draft.categories[catId].coverImage = dataUrl;
        } else if (targetType === "catLogo" && catId && draft.categories[catId]) {
          draft.categories[catId].logoImage = dataUrl;
        }


        event.target.value = "";
        showToast("تم تجهيز الصورة — اضغط (حفظ إعدادات الموقع والأقسام) لتثبيتها.");
        render();

          ${state.adminTab === "branding" ? renderAdminBrandingTab() : `

                  <textarea id="f-description" rows="6" required placeholder="اكتب مواصفات المنتج هنا..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm leading-relaxed focus:outline-none focus:border-[#C8A236]">${escapeHtml(editingItem ? editingItem.description : "")}</textarea>

                      <span class="text-sm font-extrabold text-[#0B132B]">صور المنتج (مسموح حتى 15 صورة)</span>
                      <span id="admin-img-count" class="mr-2 text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-[#9A7418]">${state.adminFormImages.length} / 15</span>
                    </div>
                    <label class="cursor-pointer px-4 py-2 rounded-xl gold-gradient text-[#0B132B] text-xs font-extrabold shadow-sm">

                    <input id="f-img-url" type="url" placeholder="أو الصق رابط صورة مباشر (https://...)" class="flex-1 bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-[#C8A236]" />

              <div class="divide-y divide-gray-100">
                ${filteredAdminProducts.map(p => {
                  const catName = getCategoryConfig(p.category).name;

    function renderAdminImagesGridHtml() {
      if (state.adminFormImages.length === 0) {
        return `<div class="col-span-full text-center py-4 text-xs text-gray-400">لم تُضف صور بعد (يمكنك إضافة حتى 15 صورة، والصورة الأولى ستكون الغلاف الرئيسي).</div>`;
      }
      return state.adminFormImages.map((src, i) => `
        <div class="relative group rounded-xl overflow-hidden aspect-square bg-[#0B132B] border-2 ${i === 0 ? "border-[#C8A236]" : "border-transparent"}">
          <img src="${src}" class="w-full h-full object-cover" />
          ${i === 0 ? `<span class="absolute top-1 right-1 bg-[#C8A236] text-[#0B132B] text-[9px] font-extrabold px-1.5 py-0.5 rounded">الرئيسية</span>` : `
            <button type="button" onclick="setAdminMainImage(${i})" class="absolute top-1 right-1 bg-black/70 text-white text-[9px] px-1.5 py-0.5 rounded hover:bg-[#C8A236] hover:text-[#0B132B]">جعلها رئيسية</button>
          `}
          <button type="button" onclick="removeAdminImage(${i})" class="absolute bottom-1 left-1 w-6 h-6 rounded-full bg-red-600/90 text-white text-xs font-bold flex items-center justify-center">×</button>
        </div>
      `).join("");
    }


    function refreshAdminImagePreview() {
      const grid = document.getElementById("admin-images-grid");
      const badge = document.getElementById("admin-img-count");
      if (grid) grid.innerHTML = renderAdminImagesGridHtml();
      if (badge) badge.textContent = `${state.adminFormImages.length} / ${MAX_IMAGES_PER_PRODUCT}`;
    }


    function compressImageFile(file, maxWidth = 1200, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }


    window.handleAdminImageFiles = async function (event) {
      const files = Array.from(event.target.files || []);
      const remaining = MAX_IMAGES_PER_PRODUCT - state.adminFormImages.length;
      if (remaining <= 0) {
        showToast(`الحد الأقصى هو ${MAX_IMAGES_PER_PRODUCT} صورة للمنتج الواحد.`);
        return;
      }
      const toProcess = files.slice(0, remaining);
      if (files.length > remaining) {
        showToast(`تم اختيار أول ${remaining} صورة فقط للوصول للحد الأقصى (15 صورة).`);
      }
      for (const file of toProcess) {
        try {
          const dataUrl = await compressImageFile(file);
          state.adminFormImages.push(dataUrl);
        } catch (err) {
          console.error(err);
        }
      }
      event.target.value = "";
      refreshAdminImagePreview();
    };


    window.addAdminImageUrl = function () {
      const inp = document.getElementById("f-img-url");
      const url = (inp ? inp.value : "").trim();
      if (!url) return;
      if (state.adminFormImages.length >= MAX_IMAGES_PER_PRODUCT) {
        showToast(`الحد الأقصى هو ${MAX_IMAGES_PER_PRODUCT} صورة.`);
        return;
      }
      state.adminFormImages.push(url);
      inp.value = "";
      refreshAdminImagePreview();
    };


    window.setAdminMainImage = function (index) {
      if (index <= 0 || index >= state.adminFormImages.length) return;
      const [chosen] = state.adminFormImages.splice(index, 1);
      state.adminFormImages.unshift(chosen);
      refreshAdminImagePreview();
    };


    window.removeAdminImage = function (index) {
      state.adminFormImages.splice(index, 1);
      refreshAdminImagePreview();
    };


    window.startEditProduct = async function (id) {
      const p = state.products.find(x => x.id === id);
      if (!p) return;
      state.adminTab = "products";
      state.editingProductId = id;
      showToast("جاري تحميل صور المنتج...");
      state.adminFormImages = [...(await fetchProductFullImages(p))];
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };


    window.cancelEditProduct = function () {
      state.editingProductId = null;
      state.adminFormImages = [];
      render();
    };


    window.submitProductForm = async function (event) {
      event.preventDefault();
      const btn = document.getElementById("admin-submit-btn");
      btn.disabled = true;
      btn.textContent = "جاري الحفظ...";


      const existing = state.editingProductId
        ? state.products.find(p => p.id === state.editingProductId)
        : null;


      const productObj = {
        id: existing ? existing.id : `prod-${Date.now()}`,
        category: document.getElementById("f-category").value,
        subcategory: document.getElementById("f-subcategory").value.trim(),
        title: document.getElementById("f-title").value.trim(),
        price: Number(document.getElementById("f-price").value),
        currency: document.getElementById("f-currency").value,
        description: document.getElementById("f-description").value.trim(),
        createdAt: existing ? existing.createdAt : Date.now()
      };


      try {
        await saveProductToBackend(productObj, state.adminFormImages);
        state.editingProductId = null;
        state.adminFormImages = [];
        pickRandomSelection();
        showToast(existing ? "تم حفظ تعديلات المنتج بنجاح ✅" : "تم نشر المنتج الجديد بنجاح ✅");
        render();
      } catch (err) {
        console.error(err);
        showToast("فشل الحفظ. تأكد من صلاحيات Rules في Firebase.");
        btn.disabled = false;
        btn.textContent = existing ? "حفظ التعديلات" : "نشر المنتج في الموقع";
      }
    };


    window.confirmDeleteProduct = async function (id) {
      if (!confirm("هل أنت متأكد من حذف هذا المنتج نهائياً؟")) return;
      try {
        await deleteProductFromBackend(id);
        pickRandomSelection();
        showToast("تم حذف المنتج.");
        render();
      } catch (err) {
        console.error(err);
        showToast("تعذر الحذف. تأكد من اتصال Firebase.");
      }
    };


    window.updateAdminSearch = function (val) {
      state.adminSearch = val;
      render();
    };


    // =========================================================================
    // 7. نافذة تفاصيل المنتج + عارض الصور المكبّر (Interactive Lightbox)
    // =========================================================================
    window.openProductModal = async function (productId) {
      const p = state.products.find(x => x.id === productId);
      if (!p) return;


      const cat = getCategoryConfig(p.category);
      state.modalProduct = p;
      state.modalImages = p.images && p.images.length ? [...p.images] : [makeLuxuryPlaceholder(cat.name, p.title)];
      state.modalImageIndex = 0;


      document.getElementById("modal-category-badge").textContent = cat.name;
      document.getElementById("modal-sub-badge").textContent = p.subcategory || "";
      document.getElementById("modal-title").textContent = p.title;
      document.getElementById("modal-price").textContent = formatPrice(p.price, p.currency);
      document.getElementById("modal-description").innerHTML = formatDescriptionHtml(p.description);


      const waMsg = encodeURIComponent(`مرحباً ${getSiteName()}، أستفسر عن:\n${p.title}\nالسعر: ${formatPrice(p.price, p.currency)}`);
      document.getElementById("modal-wa-btn").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`;


      updateModalGalleryUI();
      document.getElementById("product-modal").classList.remove("hidden");
      document.body.style.overflow = "hidden";


      // Load full gallery (up to 15 images) from Firestore subcollection if available
      const fullImages = await fetchProductFullImages(p);
      if (state.modalProduct && state.modalProduct.id === p.id && fullImages.length > 0) {
        state.modalImages = fullImages;
        updateModalGalleryUI();
      }
    };


    window.closeProductModal = function () {
      document.getElementById("product-modal").classList.add("hidden");
      document.body.style.overflow = "";
    };


    function updateModalGalleryUI() {
      const imgs = state.modalImages;
      const idx = state.modalImageIndex;
      document.getElementById("modal-main-img").src = imgs[idx] || "";
      document.getElementById("modal-img-counter").textContent = `${idx + 1} / ${imgs.length}`;


      const prevBtn = document.getElementById("modal-prev-img");
      const nextBtn = document.getElementById("modal-next-img");
      const thumbsEl = document.getElementById("modal-thumbs");


      if (imgs.length > 1) {
        prevBtn.classList.remove("hidden");
        nextBtn.classList.remove("hidden");
        thumbsEl.classList.remove("hidden");
        thumbsEl.innerHTML = imgs.map((src, i) => `
          <img
            src="${src}"
            onclick="selectModalImage(${i})"
            class="w-16 h-12 object-cover rounded-lg cursor-pointer shrink-0 border-2 transition ${i === idx ? "border-[#E3C265] opacity-100" : "border-transparent opacity-55 hover:opacity-90"}"
          />
        `).join("");
      } else {
        prevBtn.classList.add("hidden");
        nextBtn.classList.add("hidden");
        thumbsEl.classList.add("hidden");
      }
    }


    window.selectModalImage = function (index) {
      state.modalImageIndex = index;
      updateModalGalleryUI();
    };


    window.stepModalImage = function (delta) {
      const len = state.modalImages.length;
      if (len <= 1) return;
      state.modalImageIndex = (state.modalImageIndex + delta + len) % len;
      updateModalGalleryUI();
    };


    // ==================== INTERACTIVE FULLSCREEN LIGHTBOX ====================
    const lb = {
      scale: 1,
      x: 0,
      y: 0,
      dragging: false,
      startX: 0,
      startY: 0,
      pinchStartDist: 0,
      pinchStartScale: 1,
      lastTap: 0
    };


    function applyLightboxTransform() {
      const img = document.getElementById("lightbox-img");
      img.style.transform = `translate(${lb.x}px, ${lb.y}px) scale(${lb.scale})`;
      document.getElementById("lightbox-zoom-label").textContent = `${Math.round(lb.scale * 100)}%`;
      img.style.cursor = lb.scale > 1 ? (lb.dragging ? "grabbing" : "grab") : "zoom-in";
    }


    window.resetLightboxZoom = function () {
      lb.scale = 1;
      lb.x = 0;
      lb.y = 0;
      applyLightboxTransform();
    };


    window.zoomLightbox = function (delta) {
      lb.scale = Math.min(5, Math.max(1, +(lb.scale + delta).toFixed(2)));
      if (lb.scale === 1) { lb.x = 0; lb.y = 0; }
      applyLightboxTransform();
    };


    window.openLightboxCurrent = function () {
      const imgs = state.modalImages;
      if (!imgs || imgs.length === 0) return;
      document.getElementById("lightbox-img").src = imgs[state.modalImageIndex];
      document.getElementById("lightbox-counter").textContent = `${state.modalImageIndex + 1} / ${imgs.length}`;
      document.getElementById("lb-prev").classList.toggle("hidden", imgs.length <= 1);
      document.getElementById("lb-next").classList.toggle("hidden", imgs.length <= 1);
      resetLightboxZoom();
      document.getElementById("image-lightbox").classList.remove("hidden");
    };


    window.closeLightbox = function () {
      document.getElementById("image-lightbox").classList.add("hidden");
      resetLightboxZoom();
    };


    window.stepLightbox = function (delta) {
      stepModalImage(delta);
      const imgs = state.modalImages;
      document.getElementById("lightbox-img").src = imgs[state.modalImageIndex];
      document.getElementById("lightbox-counter").textContent = `${state.modalImageIndex + 1} / ${imgs.length}`;
      resetLightboxZoom();
    };


    // Lightbox Mouse Wheel, Drag, Double-Click, and Mobile Pinch-to-Zoom
    const lbViewport = document.getElementById("lightbox-viewport");


    lbViewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      zoomLightbox(e.deltaY < 0 ? 0.35 : -0.35);
    }, { passive: false });


    lbViewport.addEventListener("dblclick", (e) => {
      if (e.target.closest("button")) return;
      if (lb.scale > 1) resetLightboxZoom();
      else { lb.scale = 2.5; applyLightboxTransform(); }
    });


    lbViewport.addEventListener("mousedown", (e) => {
      if (e.target.closest("button") || lb.scale <= 1) return;
      lb.dragging = true;
      lb.startX = e.clientX - lb.x;
      lb.startY = e.clientY - lb.y;
      applyLightboxTransform();
    });


    window.addEventListener("mousemove", (e) => {
      if (!lb.dragging) return;
      lb.x = e.clientX - lb.startX;
      lb.y = e.clientY - lb.startY;
      applyLightboxTransform();
    });


    window.addEventListener("mouseup", () => {
      if (!lb.dragging) return;
      lb.dragging = false;
      applyLightboxTransform();
    });


    lbViewport.addEventListener("touchstart", (e) => {
      if (e.target.closest("button")) return;
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lb.pinchStartDist = Math.hypot(dx, dy);
        lb.pinchStartScale = lb.scale;
      } else if (e.touches.length === 1) {
        const now = Date.now();
        if (now - lb.lastTap < 280) {
          if (lb.scale > 1) resetLightboxZoom();
          else { lb.scale = 2.5; applyLightboxTransform(); }
          lb.lastTap = 0;
          return;
        }
        lb.lastTap = now;
        if (lb.scale > 1) {
          lb.dragging = true;
          lb.startX = e.touches[0].clientX - lb.x;
          lb.startY = e.touches[0].clientY - lb.y;
        }
      }
    }, { passive: true });


    lbViewport.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && lb.pinchStartDist > 0) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        lb.scale = Math.min(5, Math.max(1, +(lb.pinchStartScale * (dist / lb.pinchStartDist)).toFixed(2)));
        if (lb.scale === 1) { lb.x = 0; lb.y = 0; }
        applyLightboxTransform();
      } else if (e.touches.length === 1 && lb.dragging && lb.scale > 1) {
        e.preventDefault();
        lb.x = e.touches[0].clientX - lb.startX;
        lb.y = e.touches[0].clientY - lb.startY;
        applyLightboxTransform();
      }
    }, { passive: false });


    lbViewport.addEventListener("touchend", () => {
      lb.dragging = false;
      lb.pinchStartDist = 0;
    });


    window.addEventListener("keydown", (e) => {
      const lbOpen = !document.getElementById("image-lightbox").classList.contains("hidden");
      if (lbOpen) {
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowRight") stepLightbox(-1);
        if (e.key === "ArrowLeft") stepLightbox(1);
        if (e.key === "+" || e.key === "=") zoomLightbox(0.4);
        if (e.key === "-") zoomLightbox(-0.4);
      } else if (e.key === "Escape") {
        closeProductModal();
      }
    });


    // =========================================================================
    // 8. دالة الرسم الرئيسية
    // =========================================================================
    function render() {
      syncBrandChrome();


      const root = document.getElementById("app-root");
      const backBtn = document.getElementById("nav-back-btn");
      backBtn.classList.toggle("hidden", state.view === "home");


      if (state.view === "home") {
        root.innerHTML = renderHomeView();
      } else if (state.view === "category") {
        root.innerHTML = renderCategoryView();
      } else if (state.view === "admin") {
        root.innerHTML = renderAdminView();
      }


      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
    }


    initFirebaseAndData();
  </script>
</body>
</html>
